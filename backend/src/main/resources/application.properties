spring.application.name=RailOpt
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# ─── MongoDB Configuration ───────────────────────────────────────────
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:${MONGODB_URI:mongodb://localhost:27017/railopt}}
spring.data.mongodb.auto-index-creation=true

# ─── Server & CORS ───────────────────────────────────────────────────
server.port=${SERVER_PORT:8080}

spring.web.cors.allowed-origins=http://localhost:5173
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

# ─── Jackson JSON ────────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ─── Logging ─────────────────────────────────────────────────────────
logging.level.com.railopt=INFO
logging.level.com.railopt.service.tracking=INFO
logging.level.org.springframework.data.mongodb=INFO

# ─── Train Tracking & RailRadar Configuration ─────────────────────────
railopt.tracking.provider=${TRAIN_TRACKING_PROVIDER:railradar}
railopt.tracking.railradar.api-key=${RAILRADAR_API_KEY:}
railopt.tracking.railradar.base-url=${RAILRADAR_BASE_URL:https://api.railradar.in/v1}

# ─── Gemini AI Explanation Layer (Advisory Only) ──────────────────────
railopt.ai.gemini.api-key=${GEMINI_API_KEY:}
railopt.ai.gemini.model=${GEMINI_MODEL:gemini-3.6-flash}
railopt.ai.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
railopt.ai.gemini.timeout-seconds=25

